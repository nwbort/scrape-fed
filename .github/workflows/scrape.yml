name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Every 30 minutes (off the busy :00)
  - cron: '13,43 * * * *'

permissions:
  contents: write

# Never let two runs race each other on the same state files.
concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Subscribe to this topic in the ntfy app (or at https://ntfy.sh/<topic>).
  # Anyone who knows the topic name can read it; set a repository variable
  # NTFY_TOPIC to override it with a private one.
  NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'scrape-fed-5c1e7b2d94a3' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    # Chrome is only used for judgments (judgments.fedcourt.gov.au is behind
    # Cloudflare), and both it and Xvfb are normally pre-installed on
    # ubuntu-latest, so only touch apt if one of them is actually missing.
    - name: Install Chrome and Xvfb
      run: |
        need_update=1
        apt_install() {
          if [ -n "$need_update" ]; then sudo apt-get update; need_update=; fi
          sudo apt-get install -y "$@"
        }
        command -v xvfb-run >/dev/null 2>&1 || apt_install xvfb
        if ! command -v google-chrome >/dev/null 2>&1; then
          apt_install chromium-browser || apt_install chromium
        fi
        CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
        echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
    - name: Run the scraper
      run: |
        ./scrape.sh
    # Still commit whatever did succeed if one file failed, so the change
    # isn't notified again next run.
    - name: Commit and push
      if: ${{ !cancelled() }}
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git pull --rebase
        git push
